name: Update my feed

on:
  schedule:
    - cron: "7,37 * * * *"   # every 30 minutes (off the hour, when GitHub is less busy)
  workflow_dispatch:          # lets you press "Run workflow" to refresh now
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy1.outputs.page_url || steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Collect the latest posts
        run: node scripts/fetch-feeds.mjs

      - name: Build the site
        run: |
          mkdir _site
          cp -r index.html manifest.json sw.js icons data _site/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy1
        uses: actions/deploy-pages@v4
        continue-on-error: true
      # GitHub occasionally has a hiccup publishing; wait a moment and try again.
      - if: steps.deploy1.outcome == 'failure'
        run: sleep 20
      - id: deploy
        if: steps.deploy1.outcome == 'failure'
        uses: actions/deploy-pages@v4

      # GitHub pauses timed jobs on repos with no activity for 60 days.
      # This makes a tiny empty commit every few weeks so your feed never stops.
      - name: Keep the timer alive
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 40 * 86400 )) ]; then
            git config user.name "feed-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "Keep feed timer alive [skip ci]"
            git push
          fi
