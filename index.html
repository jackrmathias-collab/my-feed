<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Feed</title>
<meta name="theme-color" content="#0a0a0c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="My Feed">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0a0c; --panel:#141418; --panel2:#1c1c22; --line:#26262e;
    --text:#f2f2f5; --muted:#8b8b98; --accent:#c084fc; --accent2:#22d3ee;
    --safe-top:env(safe-area-inset-top,0px); --safe-bot:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 Inter,system-ui,-apple-system,sans-serif}
  a{color:inherit;text-decoration:none}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

  header{position:sticky;top:0;z-index:20;background:rgba(10,10,12,.82);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
    padding:calc(var(--safe-top) + 10px) 0 0;border-bottom:1px solid var(--line)}
  .bar{max-width:680px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:0 16px 10px}
  .logo{font:700 22px/1 "Space Grotesk",sans-serif;letter-spacing:-.02em;
    background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
  .updated{color:var(--muted);font-size:12px;margin-right:auto}
  .icon-btn{height:36px;min-width:36px;border-radius:18px;display:inline-flex;align-items:center;justify-content:center;gap:6px;
    background:var(--panel2);border:1px solid var(--line);padding:0 10px}
  .icon-btn svg{width:18px;height:18px}
  .wordle{background:#538d4e;border-color:#538d4e;font-weight:600;font-size:13px;color:#fff}
  .wordle.done{background:var(--panel2);border-color:var(--line);color:var(--muted)}
  .tabs{max-width:680px;margin:0 auto;display:flex;gap:6px;overflow-x:auto;padding:0 16px 10px;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tab{flex:none;padding:7px 14px;border-radius:999px;background:var(--panel);border:1px solid var(--line);color:var(--muted);font-weight:500;font-size:14px;white-space:nowrap}
  .tab .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:7px;vertical-align:1px}
  .tab.on{background:var(--text);color:#000;border-color:var(--text)}

  main{max-width:680px;margin:0 auto;padding:4px 0 calc(var(--safe-bot) + 40px)}
  .card{display:block;padding:14px 16px;border-bottom:1px solid var(--line);position:relative}
  .card:active{background:var(--panel)}
  .meta{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:13px;margin-bottom:4px}
  .meta .dot{width:8px;height:8px;border-radius:50%;flex:none}
  .meta .src{color:var(--text);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .meta .tabname{white-space:nowrap}
  .title{font-weight:600;font-size:16.5px;line-height:1.35;margin:0 0 4px;letter-spacing:-.005em}
  .summary{color:#b9b9c4;margin:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:14.5px}
  .img{margin-top:10px;border-radius:14px;overflow:hidden;background:var(--panel2);border:1px solid var(--line);aspect-ratio:16/9}
  .img img{width:100%;height:100%;object-fit:cover;display:block}
  .actions{display:flex;gap:4px;margin-top:8px;margin-left:-8px}
  .act{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:13px;padding:6px 8px;border-radius:999px}
  .act svg{width:18px;height:18px}
  .act.saved{color:var(--accent)}
  .act.saved svg{fill:currentColor}

  .divider{display:flex;align-items:center;gap:10px;color:var(--accent);font-size:13px;font-weight:600;padding:14px 16px}
  .divider:before,.divider:after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--accent),transparent)}
  .empty{color:var(--muted);text-align:center;padding:60px 24px}
  .empty b{display:block;color:var(--text);font-size:17px;margin-bottom:6px}

  .grid{columns:2;column-gap:8px;padding:8px}
  @media(min-width:640px){.grid{columns:3}}
  .tile{display:block;break-inside:avoid;margin-bottom:8px;border-radius:14px;overflow:hidden;position:relative;background:var(--panel2)}
  .tile img{width:100%;display:block}
  .tile .cap{position:absolute;inset:auto 0 0 0;padding:28px 10px 9px;font-size:12.5px;font-weight:600;line-height:1.3;
    background:linear-gradient(transparent,rgba(0,0,0,.85))}

  .sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:40;display:none}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-height:85vh;overflow:auto;background:var(--panel);border-top:1px solid var(--line);
    border-radius:20px 20px 0 0;padding:18px 18px calc(var(--safe-bot) + 24px);transform:translateY(105%);transition:transform .25s ease}
  .sheet.open{transform:none}
  .sheet-inner{max-width:640px;margin:0 auto}
  .sheet h2{font:700 20px "Space Grotesk",sans-serif;margin:0 0 4px}
  .sheet h3{font-size:14px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:24px 0 8px}
  .sheet p.hint{color:var(--muted);font-size:13.5px;margin:0 0 10px}
  .row{display:flex;gap:8px}
  .row input{flex:1;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;color:var(--text);font:inherit}
  .btn{background:var(--text);color:#000;border-radius:12px;padding:10px 16px;font-weight:600}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  .chip{background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:5px 8px 5px 12px;font-size:13.5px;display:inline-flex;align-items:center;gap:6px}
  .chip button{color:var(--muted);font-size:16px;line-height:1;padding:0 4px}
  .toggle{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)}
  .toggle input{width:20px;height:20px;accent-color:var(--accent)}
  .health{font-size:13.5px}
  .health div{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--line)}
  .health .bad{color:#f87171}
  .health .good{color:#4ade80}
  .close{position:absolute;right:16px;top:14px}
  .toast{position:fixed;left:50%;bottom:calc(var(--safe-bot) + 24px);transform:translateX(-50%) translateY(20px);opacity:0;
    background:var(--text);color:#000;padding:10px 16px;border-radius:999px;font-weight:600;font-size:14px;transition:.2s;z-index:50;pointer-events:none}
  .toast.show{opacity:1;transform:translateX(-50%)}
  .more{height:1px}
</style>
</head>
<body>
<header>
  <div class="bar">
    <span class="logo">My Feed</span>
    <span class="updated" id="updated"></span>
    <a class="icon-btn wordle" id="wordle" href="https://www.nytimes.com/games/wordle/index.html" target="_blank" rel="noopener">Wordle</a>
    <button class="icon-btn" id="refresh" aria-label="Refresh">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>
    </button>
    <button class="icon-btn" id="settingsBtn" aria-label="Settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>
    </button>
  </div>
  <nav class="tabs" id="tabs"></nav>
</header>

<main id="main"><div class="empty"><b>Loading your feed…</b></div></main>

<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="sheet">
  <div class="sheet-inner">
    <button class="icon-btn close" id="closeSheet" aria-label="Close">✕</button>
    <h2>Settings</h2>

    <h3>Mute words</h3>
    <p class="hint">Posts that mention any of these words are hidden everywhere.</p>
    <form class="row" id="muteForm">
      <input id="muteInput" placeholder="e.g. Love Island" autocomplete="off">
      <button class="btn" type="submit">Mute</button>
    </form>
    <div class="chips" id="muteList"></div>

    <h3>Show in the All feed</h3>
    <p class="hint">Turn a topic off to keep it in its own tab only.</p>
    <div id="allToggles"></div>

    <h3>Sources</h3>
    <p class="hint">A red one isn't working right now. If it stays red for a few days, remove it from feeds.json.</p>
    <div class="health" id="health"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
(() => {
  const $ = (s) => document.querySelector(s);
  const store = {
    get(k, d) { try { const v = localStorage.getItem("myfeed:" + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem("myfeed:" + k, JSON.stringify(v)); } catch {} },
  };

  let data = { items: [], tabs: [], health: [] };
  let current = location.hash.slice(1) || "all";
  let saved = store.get("saved", {});        // id -> item
  let muted = store.get("muted", []);
  let hiddenFromAll = store.get("hiddenFromAll", []);
  const prevVisit = store.get("lastVisit", null);
  store.set("lastVisit", new Date().toISOString());
  let list = [], shown = 0;
  const PAGE = 30;

  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const tabInfo = (id) => data.tabs.find((t) => t.id === id) || { name: id, colour: "#888" };
  const ago = (iso) => {
    if (!iso) return "";
    const m = Math.round((Date.now() - Date.parse(iso)) / 60000);
    if (m < 1) return "now";
    if (m < 60) return m + "m";
    if (m < 1440) return Math.round(m / 60) + "h";
    const d = Math.round(m / 1440);
    return d < 7 ? d + "d" : new Date(iso).toLocaleDateString("en-GB", { day: "numeric", month: "short" });
  };
  const toast = (msg) => { const t = $("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), 1800); };
  const isMuted = (it) => { if (!muted.length) return false; const hay = (it.title + " " + it.summary + " " + it.source).toLowerCase(); return muted.some((w) => hay.includes(w.toLowerCase())); };

  // Wordle: show as done once tapped today
  const today = new Date().toDateString();
  const wordle = $("#wordle");
  const markWordle = () => { if (store.get("wordleDay") === today) { wordle.classList.add("done"); wordle.textContent = "Wordle ✓"; } };
  wordle.addEventListener("click", () => { store.set("wordleDay", today); setTimeout(markWordle, 300); });
  markWordle();

  function renderTabs() {
    const tabs = [{ id: "all", name: "All" }, { id: "pictures", name: "Pictures" }, ...data.tabs, { id: "saved", name: "Saved" }];
    $("#tabs").innerHTML = tabs.map((t) =>
      `<button class="tab ${t.id === current ? "on" : ""}" data-tab="${t.id}">${t.colour ? `<span class="dot" style="background:${t.colour}"></span>` : ""}${esc(t.name)}</button>`
    ).join("");
    const on = $("#tabs .on"); if (on) on.scrollIntoView({ inline: "center", block: "nearest" });
  }

  // Stops one busy source taking over the All feed
  function spreadOut(items) {
    const out = [], pool = items.slice();
    while (pool.length) {
      const last = out.slice(-2).map((x) => x.source);
      let i = pool.findIndex((x, n) => n < 6 && !last.includes(x.source));
      if (i < 0) i = 0;
      out.push(pool.splice(i, 1)[0]);
    }
    return out;
  }

  function build() {
    const visible = data.items.filter((it) => !isMuted(it));
    if (current === "all") return spreadOut(visible.filter((it) => !hiddenFromAll.includes(it.tab)));
    if (current === "pictures") return visible.filter((it) => it.pictures && it.image);
    if (current === "saved") return Object.values(saved).sort((a, b) => (b.savedAt || 0) - (a.savedAt || 0));
    return visible.filter((it) => it.tab === current);
  }

  const bookmarkSvg = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M6 3h12v18l-6-4-6 4z"/></svg>`;
  const shareSvg = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3v13M7 8l5-5 5 5M5 14v6h14v-6"/></svg>`;

  function card(it) {
    const t = tabInfo(it.tab), isSaved = !!saved[it.id];
    return `<article class="card">
      <a href="${esc(it.link)}" target="_blank" rel="noopener">
        <div class="meta"><span class="dot" style="background:${t.colour}"></span><span class="src">${esc(it.source)}</span>
          <span class="tabname">· ${esc(t.name)}</span><span>· ${ago(it.date)}</span></div>
        <h2 class="title">${esc(it.title)}</h2>
        ${it.summary ? `<p class="summary">${esc(it.summary)}</p>` : ""}
        ${it.image ? `<div class="img"><img loading="lazy" referrerpolicy="no-referrer" src="${esc(it.image)}" alt="" onerror="this.parentNode.remove()"></div>` : ""}
      </a>
      <div class="actions">
        <button class="act ${isSaved ? "saved" : ""}" data-save="${it.id}">${bookmarkSvg}${isSaved ? "Saved" : "Save"}</button>
        <button class="act" data-share="${it.id}">${shareSvg}Share</button>
      </div>
    </article>`;
  }

  function tile(it) {
    return `<a class="tile" href="${esc(it.link)}" target="_blank" rel="noopener">
      <img loading="lazy" referrerpolicy="no-referrer" src="${esc(it.image)}" alt="" onerror="this.parentNode.remove()">
      <div class="cap">${esc(it.title)}</div></a>`;
  }

  function render() {
    renderTabs();
    list = build(); shown = 0;
    const main = $("#main");
    if (!list.length) {
      const msg = current === "saved" ? ["Nothing saved yet", "Tap Save on any post to keep it here for later."]
        : data.items.length ? ["Nothing here right now", "Check back soon, or look at your muted words."]
        : ["No posts yet", "Your feed fills up after the first automatic refresh."];
      main.innerHTML = `<div class="empty"><b>${msg[0]}</b>${msg[1]}</div>`;
      return;
    }
    main.innerHTML = current === "pictures" ? `<div class="grid" id="list"></div><div class="more" id="more"></div>` : `<div id="list"></div><div class="more" id="more"></div>`;
    more();
    observer.disconnect(); observer.observe($("#more"));
    window.scrollTo(0, 0);
  }

  function more() {
    const el = $("#list"); if (!el) return;
    const chunk = list.slice(shown, shown + PAGE);
    let html = "";
    for (const it of chunk) {
      // "Caught up" line where the posts you've already seen begin (All feed only)
      if (current === "all" && prevVisit && !el._dividerDone && it.date && it.date < prevVisit && shown > 0) {
        html += `<div class="divider">You're all caught up</div>`; el._dividerDone = true;
      }
      html += current === "pictures" ? tile(it) : card(it);
      shown++;
    }
    el.insertAdjacentHTML("beforeend", html);
  }
  const observer = new IntersectionObserver((e) => { if (e[0].isIntersecting && shown < list.length) more(); }, { rootMargin: "800px" });

  $("#tabs").addEventListener("click", (e) => {
    const b = e.target.closest("[data-tab]"); if (!b) return;
    current = b.dataset.tab; history.replaceState(null, "", current === "all" ? location.pathname : "#" + current); render();
  });

  $("#main").addEventListener("click", async (e) => {
    const s = e.target.closest("[data-save]");
    if (s) {
      const id = s.dataset.save;
      if (saved[id]) { delete saved[id]; toast("Removed from Saved"); }
      else { const it = data.items.find((x) => x.id === id); if (it) { saved[id] = { ...it, savedAt: Date.now() }; toast("Saved for later"); } }
      store.set("saved", saved);
      if (current === "saved") return render();
      s.classList.toggle("saved", !!saved[id]); s.innerHTML = bookmarkSvg + (saved[id] ? "Saved" : "Save");
      return;
    }
    const sh = e.target.closest("[data-share]");
    if (sh) {
      const it = data.items.find((x) => x.id === sh.dataset.share) || saved[sh.dataset.share]; if (!it) return;
      try { if (navigator.share) await navigator.share({ title: it.title, url: it.link }); else { await navigator.clipboard.writeText(it.link); toast("Link copied"); } } catch {}
    }
  });

  // Settings sheet
  const openSheet = () => { renderSettings(); $("#sheetBg").style.display = "block"; requestAnimationFrame(() => $("#sheet").classList.add("open")); };
  const closeSheet = () => { $("#sheet").classList.remove("open"); setTimeout(() => ($("#sheetBg").style.display = "none"), 250); };
  $("#settingsBtn").onclick = openSheet; $("#closeSheet").onclick = closeSheet; $("#sheetBg").onclick = closeSheet;

  function renderSettings() {
    $("#muteList").innerHTML = muted.length ? muted.map((w, i) => `<span class="chip">${esc(w)}<button data-unmute="${i}" aria-label="Unmute">×</button></span>`).join("") : `<span class="hint" style="color:var(--muted);font-size:13.5px">No muted words yet.</span>`;
    $("#allToggles").innerHTML = data.tabs.map((t) => `<label class="toggle"><span><span class="dot" style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${t.colour};margin-right:8px"></span>${esc(t.name)}</span>
      <input type="checkbox" data-alltab="${t.id}" ${hiddenFromAll.includes(t.id) ? "" : "checked"}></label>`).join("");
    $("#health").innerHTML = (data.health || []).map((h) => `<div><span>${esc(h.name)} <span style="color:var(--muted)">· ${esc(tabInfo(h.tab).name)}</span></span>
      ${h.ok ? `<span class="good">✓ ${h.count}</span>` : `<span class="bad" title="${esc(h.error)}">✗ not working</span>`}</div>`).join("");
  }
  $("#muteForm").onsubmit = (e) => {
    e.preventDefault(); const w = $("#muteInput").value.trim(); if (!w) return;
    if (!muted.some((m) => m.toLowerCase() === w.toLowerCase())) muted.push(w);
    store.set("muted", muted); $("#muteInput").value = ""; renderSettings(); render();
  };
  $("#muteList").onclick = (e) => { const b = e.target.closest("[data-unmute]"); if (!b) return; muted.splice(+b.dataset.unmute, 1); store.set("muted", muted); renderSettings(); render(); };
  $("#allToggles").onchange = (e) => {
    const id = e.target.dataset.alltab; if (!id) return;
    hiddenFromAll = e.target.checked ? hiddenFromAll.filter((x) => x !== id) : [...hiddenFromAll, id];
    store.set("hiddenFromAll", hiddenFromAll); if (current === "all") render();
  };

  function setUpdated() { if (data.updated) $("#updated").textContent = "Updated " + ago(data.updated) + (ago(data.updated) === "now" ? "" : " ago"); }

  async function load(manual) {
    try {
      const res = await fetch("data/feed.json?t=" + Date.now(), { cache: "no-store" });
      if (!res.ok) throw new Error(res.status);
      data = await res.json();
      setUpdated(); render();
      if (manual) toast("Up to date");
    } catch (e) {
      if (!data.items.length) $("#main").innerHTML = `<div class="empty"><b>Couldn't load your feed</b>Check your connection and tap refresh.</div>`;
      else if (manual) toast("Couldn't refresh");
    }
  }
  $("#refresh").onclick = () => load(true);
  setInterval(setUpdated, 60000);
  document.addEventListener("visibilitychange", () => { if (!document.hidden && data.updated && Date.now() - Date.parse(data.updated) > 30 * 60000) load(); });
  load();

  if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
})();
</script>
</body>
</html>
